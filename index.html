<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="description" content="Plataforma de práctica para la Fase 1 de la Olimpiada Salvadoreña de Inteligencia Artificial (OSIA).">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profe Nodo: 5 clases para la Fase 1 OSIA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FD; --grid:#DDE7F3; --surface:#FFFFFF; --ink:#1C2533; --muted:#5A6577;
  --pen:#1F3FA0; --pen-soft:#E3E9FA; --hl:#FFE45C; --hl-ink:#3A3000;
  --ok:#17804F; --ok-soft:#DDF3E8; --bad:#C8322F; --bad-soft:#FBE3E2;
  --line:#C9D5E6; --c1:#2E9E5B; --c2:#E8892B; --c3:#7A4FD0; --c4:#1F8FB0;
  --font-h:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A2A; --grid:#1B2740; --surface:#17223A; --ink:#E6ECF5; --muted:#9AA8BD;
    --pen:#8FB2FF; --pen-soft:#22325A; --hl:#FFD84D; --hl-ink:#2A2200;
    --ok:#4CC98A; --ok-soft:#163A2A; --bad:#FF7B76; --bad-soft:#3E1E22;
    --line:#2C3A58; --c1:#4CC98A; --c2:#FFA552; --c3:#B392FF; --c4:#5BC6E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2A; --grid:#1B2740; --surface:#17223A; --ink:#E6ECF5; --muted:#9AA8BD;
  --pen:#8FB2FF; --pen-soft:#22325A; --hl:#FFD84D; --hl-ink:#2A2200;
  --ok:#4CC98A; --ok-soft:#163A2A; --bad:#FF7B76; --bad-soft:#3E1E22;
  --line:#2C3A58; --c1:#4CC98A; --c2:#FFA552; --c3:#B392FF; --c4:#5BC6E6;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  margin:0; font-family:var(--font-b); font-size:17px; line-height:1.6; color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-h); line-height:1.15; margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.1rem); font-weight:800; letter-spacing:-.02em}
h2{font-size:1.6rem; font-weight:700}
h3{font-size:1.2rem; font-weight:700}
p{margin:0 0 .9em}
a{color:var(--pen)}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
.wrap{max-width:900px; margin:0 auto; padding:0 18px}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:2px solid var(--ink)}
.top .wrap{display:flex; align-items:center; gap:14px; min-height:58px; flex-wrap:wrap}
.brand{font-family:var(--font-h); font-weight:800; font-size:1.15rem; text-decoration:none; color:var(--ink); margin-right:auto}
.brand span{background:var(--hl); color:var(--hl-ink); padding:0 6px; border-radius:3px}
.nav{display:flex; gap:4px; overflow-x:auto}
.nav a{text-decoration:none; color:var(--ink); padding:6px 12px; border-radius:999px; font-weight:700; white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink); color:var(--surface)}
.themebtn{border:1.5px solid var(--line); background:transparent; border-radius:999px; width:36px; height:36px; cursor:pointer}

main{padding:26px 0 80px}
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:20px; margin:0 0 18px}
.card.ink{border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.hl{background:linear-gradient(transparent 55%, var(--hl) 55%); padding:0 2px}
.btn{display:inline-flex; align-items:center; gap:8px; border:2px solid var(--ink); background:var(--ink); color:var(--surface);
  padding:9px 16px; border-radius:10px; font-weight:700; cursor:pointer; text-decoration:none}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.small{padding:5px 11px; font-size:.9rem; border-width:1.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.tag{display:inline-block; font-size:.82rem; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--pen-soft); color:var(--pen)}

/* hero */
.hero{display:grid; grid-template-columns:1fr auto; gap:18px; align-items:end; margin-bottom:22px}
.hero h1{margin:0}
.count{font-family:var(--font-h); text-align:right}
.count b{display:block; font-size:3.4rem; line-height:1; font-weight:800}
@media (max-width:640px){.hero{grid-template-columns:1fr}.count{text-align:left}}
.bar{height:12px; background:var(--pen-soft); border-radius:99px; overflow:hidden; border:1.5px solid var(--ink)}
.bar i{display:block; height:100%; background:var(--hl); border-right:1.5px solid var(--ink)}

/* route */
.route{list-style:none; margin:0; padding:0 0 0 6px; position:relative}
.route::before{content:""; position:absolute; left:27px; top:20px; bottom:20px; border-left:3px dashed var(--line)}
.stop{position:relative; display:grid; grid-template-columns:46px 1fr auto; gap:14px; align-items:center; padding:9px 0}
.dot{width:44px; height:44px; border-radius:50%; border:2.5px solid var(--ink); background:var(--surface); display:grid; place-items:center;
  font-family:var(--font-h); font-weight:800; font-size:1.1rem; position:relative; z-index:1}
.stop.done .dot{background:var(--hl); color:var(--hl-ink)}
.stop.today .dot{box-shadow:0 0 0 5px var(--pen-soft); border-color:var(--pen)}
.stop a.t{text-decoration:none; color:var(--ink); display:block}
.stop a.t strong{font-family:var(--font-h); font-size:1.08rem}
.stop .meta{font-size:.88rem; color:var(--muted)}
.stop .st{font-size:.85rem; font-weight:700; color:var(--muted); text-align:right}
.stop.done .st{color:var(--ok)}
.week{font-family:var(--font-h); font-weight:700; color:var(--muted); margin:14px 0 4px 66px}

/* lesson */
.lesson h3{margin-top:1.2em}
.lesson ul{padding-left:1.2em; margin:0 0 1em}
.lesson li{margin:.25em 0}
.lesson table{border-collapse:collapse; margin:.5em 0 1em}
.lesson td,.lesson th{border:1.5px solid var(--line); padding:5px 10px; text-align:left}
.note{border-left:5px solid var(--hl); background:var(--surface); padding:10px 14px; margin:1em 0; border-radius:0 8px 8px 0}
.daynav{display:flex; justify-content:space-between; gap:10px; margin-top:10px}
.checks{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0}
.checks span{font-size:.85rem; padding:3px 10px; border-radius:99px; border:1.5px solid var(--line)}
.checks span.on{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:700}

/* activities */
.act h3::before{content:"Actividad práctica"; display:block; font-family:var(--font-b); font-size:.85rem; font-weight:700; color:var(--pen); margin-bottom:2px}
.sitem{display:grid; grid-template-columns:1fr; gap:6px; padding:10px 0; border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.choices{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--pen); color:var(--surface); border-color:var(--pen)}
.chip.right{background:var(--ok); border-color:var(--ok); color:#fff}
.chip.wrong{background:var(--bad); border-color:var(--bad); color:#fff}
.fb{font-size:.92rem; margin-top:4px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.result{margin-top:12px; padding:10px 14px; border-radius:10px; font-weight:700}
.result.ok{background:var(--ok-soft); color:var(--ok)}
.result.no{background:var(--bad-soft); color:var(--bad)}
.olist{list-style:none; padding:0; margin:0 0 10px}
.olist li{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 10px; margin:6px 0}
.olist li span{flex:1}
.olist li.right{border-color:var(--ok); background:var(--ok-soft)}
.olist li.wrong{border-color:var(--bad); background:var(--bad-soft)}
.iconbtn{border:1.5px solid var(--line); background:transparent; border-radius:8px; width:32px; height:32px; cursor:pointer}
table.tt{border-collapse:collapse; font-family:var(--font-h); font-weight:700}
table.tt th,table.tt td{border:1.5px solid var(--line); padding:6px 14px; text-align:center}
table.tt td button{min-width:44px; border:1.5px solid var(--ink); background:var(--surface); border-radius:6px; padding:2px 8px; cursor:pointer; font-weight:800}
table.tt td.right button{background:var(--ok-soft); border-color:var(--ok)}
table.tt td.wrong button{background:var(--bad-soft); border-color:var(--bad)}
.scroll{overflow-x:auto}
input[type=text],textarea,input[type=date]{border:1.5px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; width:100%}
textarea{min-height:110px; resize:vertical}
.fillrow{display:grid; grid-template-columns:1fr 120px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
canvas{max-width:100%; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); touch-action:manipulation; cursor:crosshair}
svg text{font-family:var(--font-b)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem}
.legend i{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px}
.email{display:grid; grid-template-columns:1fr auto; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.95rem}
.badge{font-size:.8rem; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap}
.badge.ok{background:var(--ok-soft); color:var(--ok)} .badge.no{background:var(--bad-soft); color:var(--bad)}
.dtable td,.dtable th{border:1.5px solid var(--line); padding:6px 10px; text-align:center}
.dtable{border-collapse:collapse}
.dtable th{cursor:pointer}
.dtable th.sel{background:var(--hl); color:var(--hl-ink)}
.dtable tr.flag td{background:var(--bad-soft)}
.dtable td.rowbtn{cursor:pointer; font-weight:700}
.probs .p{display:grid; grid-template-columns:110px 1fr 52px; gap:10px; align-items:center; margin:5px 0}
.probs .p b{display:block; height:16px; background:var(--pen); border-radius:4px}
.checklist li{list-style:none; margin:4px 0}
.checklist{padding:0}

/* quiz */
.q{padding:14px 0; border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:700; margin-bottom:8px}
.opt{display:block; width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; margin:6px 0; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{font-size:.93rem; margin-top:6px; padding:8px 12px; border-radius:8px; background:var(--pen-soft)}

/* chat (sin uso) */
.chat{display:flex; flex-direction:column; gap:10px; max-height:58vh; overflow-y:auto; padding:4px 2px 10px}
.msg{max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word}
.msg.me{align-self:flex-end; background:var(--pen); color:#fff; border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start; background:var(--surface); border:1.5px solid var(--line); border-bottom-left-radius:4px}
.composer{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:10px}
.composer textarea{min-height:52px}
.quick{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px}

/* sim */
.qgrid{display:flex; gap:5px; flex-wrap:wrap; margin:10px 0}
.qgrid button{width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700}
.qgrid button.ans{background:var(--pen-soft); border-color:var(--pen)}
.qgrid button.cur{border-color:var(--ink); border-width:2.5px}
.timer{font-family:var(--font-h); font-weight:800; font-size:1.5rem}
.tbar{display:grid; grid-template-columns:minmax(120px,240px) 1fr 50px; gap:10px; align-items:center; margin:6px 0}
.tbar .bar i{background:var(--pen)}
.gloss dt{font-weight:700; font-family:var(--font-h); margin-top:12px}
.gloss dd{margin:2px 0 0}
.empty{text-align:center; padding:30px 10px}
.fs{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.ft{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
.fq{fill:var(--pen);font-size:13px;font-weight:700}
.fl{stroke:var(--ink);stroke-width:2;fill:none;marker-end:url(#arr)}
.fa{fill:var(--ink)}
.flash{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;width:100%;min-height:210px;padding:24px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:5px 5px 0 var(--ink);cursor:pointer;text-align:center}
.flash.back{background:var(--pen-soft)}
.fterm{font-family:var(--font-h);font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;line-height:1.15}
.fdef{font-size:1.15rem;max-width:60ch}
@media (prefers-reduced-motion: no-preference){
  .stop.today .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 9px var(--pen-soft)}}
}

/* tarjetas de temas en la página principal */
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:10px}
.tcard{display:flex; flex-direction:column; gap:8px; padding:16px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface)}
.tcard.done{border-color:var(--ok)}
.tnum{font-family:var(--font-h); font-weight:800; font-size:1.5rem; background:var(--hl); color:var(--hl-ink); padding:0 8px; border-radius:6px}
.tdone{font-size:.85rem; font-weight:700; color:var(--ok)}
.tname{font-family:var(--font-h); font-size:1.15rem; line-height:1.2}
.tsubs{font-size:.88rem; color:var(--muted); margin:0}
.tlinks{display:flex; flex-direction:column; gap:6px; margin-top:auto}
.pill{display:inline-flex; align-items:center; align-self:flex-start; border:2px solid var(--ink); border-radius:999px; padding:5px 12px; font-weight:700; font-size:.92rem; text-decoration:none; color:var(--ink); white-space:nowrap}
.pill:hover,.pill:focus-visible{background:var(--ink); color:var(--surface)}

/* barra superior de cada clase: regreso + círculos de clases */
.crumbs{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.steps{display:flex; align-items:center; gap:6px}
.step{width:32px; height:32px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--font-h); font-weight:800; font-size:.9rem; text-decoration:none; color:var(--ink); background:var(--surface)}
.step.done{background:var(--hl); color:var(--hl-ink)}
.step.cur{background:var(--ink); color:var(--surface)}
.step:hover{box-shadow:0 0 0 4px var(--pen-soft)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#ruta">Ruta <span>Fase 1</span> OSIA</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#ruta" data-nav="ruta">Mi ruta</a>
      <a href="#conceptos" data-nav="conceptos">Conceptos clave</a>
      <a href="#simulacro" data-nav="simulacro">Simulacro</a>
      <a href="#glosario" data-nav="glosario">Glosario</a>
    </nav>
    <button class="themebtn" id="themeBtn" aria-label="Cambiar tema claro u oscuro">◐</button>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<script>

const TOPICS = {
  t1:"#01 Fundamentos de IA",
  t2:"#02 Pensamiento lógico y computacional",
  t3:"#03 Grafos básicos",
  t4:"#04 Datos y aprendizaje automático",
  t5:"#05 Imágenes e IA generativa",
  t6:"#06 Ética y verificación"
};

const DAYS = [
/* ---------- PARTE (antes día 1) ---------- */
{n:1, topic:"t1", title:"¿Qué es la inteligencia artificial?", mins:17,
lesson:`
<p>La <span class="hl">inteligencia artificial (IA)</span> es la rama de la informática que crea sistemas capaces de hacer tareas que normalmente necesitan inteligencia humana: reconocer caras, entender lo que decís, predecir algo, tomar decisiones o generar texto e imágenes.</p>
<h3>Programación tradicional vs. aprendizaje automático</h3>
<table><tr><th></th><th>Entra</th><th>Sale</th></tr>
<tr><td>Programación tradicional</td><td>Reglas (que escribe una persona) + datos</td><td>Respuestas</td></tr>
<tr><td>Aprendizaje automático</td><td>Datos + respuestas de ejemplo</td><td>Reglas (un <b>modelo</b>)</td></tr></table>
<p>Ejemplo: para detectar correos basura, en programación tradicional alguien escribe “si dice <i>gratis</i>, es spam”. En aprendizaje automático le damos miles de correos ya marcados como spam o no spam, y el sistema descubre solo los patrones.</p>
<h3>IA en tu día a día</h3>
<ul><li>Desbloqueo del celular con tu cara.</li><li>Recomendaciones de YouTube, TikTok o Spotify.</li><li>Google Maps calculando cuánto tardás en llegar.</li><li>El teclado que te sugiere la siguiente palabra.</li><li>Traductores y chatbots.</li></ul>
<h3>No todo lo que usa computadora es IA</h3>
<p>Una calculadora o un semáforo que cambia cada 60 segundos siguen instrucciones fijas: no aprenden ni se adaptan. Eso es programación normal.</p>
<div class="note"><b>IA estrecha vs. IA general.</b> Toda la IA que existe hoy es <i>estrecha</i>: muy buena en una tarea concreta. La IA <i>general</i> (que haga cualquier tarea intelectual como una persona) todavía no existe.</div>`,
acts:[
 {type:"sorter", title:"¿Usa IA o no?", intro:"Clasificá cada cosa. Pensá: ¿aprende de datos o solo sigue una regla fija?",
  cats:["Usa IA","No usa IA"], items:[
  {t:"Calculadora del celular", c:1, why:"Sigue operaciones matemáticas fijas."},
  {t:"Desbloqueo del celular con tu cara", c:0, why:"Un modelo aprendió a reconocer rostros."},
  {t:"Recomendaciones de videos en YouTube", c:0, why:"Aprende de lo que vos y millones de personas ven."},
  {t:"Semáforo que cambia cada 60 segundos", c:1, why:"Temporizador fijo, no aprende."},
  {t:"Traductor automático", c:0, why:"Modelos de lenguaje entrenados con muchísimo texto."},
  {t:"Filtro de spam del correo", c:0, why:"Aprende de correos marcados como spam."},
  {t:"Alarma del despertador", c:1, why:"Suena a una hora fija."},
  {t:"Teclado que sugiere la siguiente palabra", c:0, why:"Predice la palabra más probable."},
  {t:"Hoja de cálculo que suma una columna", c:1, why:"Fórmula fija."},
  {t:"Ventilador que se enciende al pasar de 28 °C", c:1, why:"Es una regla SI-ENTONCES escrita por una persona."}
 ]}
],
quiz:[
 {q:"¿Cuál es la diferencia principal entre programación tradicional y aprendizaje automático?", o:["En la tradicional una persona escribe las reglas; en el aprendizaje automático el sistema aprende patrones a partir de ejemplos","El aprendizaje automático no usa computadoras","La programación tradicional siempre es más lenta","No hay diferencia, son lo mismo"], a:0, e:"Tradicional: reglas + datos → respuestas. Aprendizaje automático: datos + respuestas → reglas (modelo)."},
 {q:"¿Cuál de estos ejemplos NO es inteligencia artificial?", o:["Un asistente de voz que entiende lo que decís","Un semáforo con temporizador fijo","Un sistema que reconoce placas de carros","Un filtro de spam"], a:1, e:"El semáforo con temporizador solo sigue una instrucción fija; no aprende ni percibe."},
 {q:"Para entrenar un sistema de aprendizaje automático que reconozca gatos, ¿qué necesitás principalmente?", o:["Una lista de reglas escritas a mano sobre cómo es un gato","Muchas imágenes de ejemplo, indicando cuáles son gatos y cuáles no","Una calculadora muy potente","Internet rápido"], a:1, e:"Aprende de ejemplos con su respuesta correcta (etiqueta)."},

/* ---------- PARTE (antes día 2) ---------- */
{n:2, topic:"t1", title:"Historia breve, reglas y aprendizaje", mins:12,
lesson:`
<h3>Momentos clave</h3>
<ul>
<li><b>1950</b>: Alan Turing pregunta si las máquinas pueden pensar y propone la <b>prueba de Turing</b>: si en una conversación no podés distinguir a la máquina de una persona.</li>
<li><b>1956</b>: conferencia de Dartmouth (EE. UU.); ahí se consolida el nombre “inteligencia artificial”.</li>
<li><b>Años 70 y 80</b>: <b>sistemas expertos</b>, programas con cientos de reglas SI-ENTONCES escritas por especialistas (por ejemplo, para diagnóstico médico).</li>
<li><b>“Inviernos de la IA”</b>: épocas en que bajó el interés y el dinero porque los resultados no cumplían lo prometido.</li>
<li><b>1997</b>: la computadora Deep Blue de IBM le gana al campeón mundial de ajedrez Garri Kaspárov.</li>
<li><b>2012</b>: las redes neuronales profundas dan un salto enorme en reconocimiento de imágenes.</li>
<li><b>2016</b>: AlphaGo vence a Lee Sedol, uno de los mejores jugadores de Go del mundo.</li>
<li><b>2022 en adelante</b>: ChatGPT y otros chatbots popularizan la <b>IA generativa</b>.</li></ul>
<h3>Dos formas de construir IA</h3>
<table><tr><th></th><th>Basada en reglas</th><th>Basada en aprendizaje</th></tr>
<tr><td>Cómo funciona</td><td>Una persona escribe SI-ENTONCES</td><td>Aprende patrones de datos</td></tr>
<tr><td>Ventaja</td><td>Fácil de entender y explicar</td><td>Maneja casos complejos y nuevos</td></tr>
<tr><td>Desventaja</td><td>Frágil: falla ante casos que nadie previó; difícil de mantener</td><td>Necesita muchos datos; a veces es difícil saber por qué decide algo</td></tr></table>
<div class="note">En la práctica extra de esta clase podés ordenar la historia y construir un filtro de spam <b>solo con reglas</b>, para que sientas por qué el aprendizaje automático ganó terreno.</div>`,

/* ---------- PARTE (antes día 3) ---------- */
{n:3, topic:"t2", title:"Lógica: proposiciones, AND, OR, NOT", mins:27,
lesson:`
<p>Una <span class="hl">proposición</span> es una afirmación que puede ser <b>verdadera (V)</b> o <b>falsa (F)</b>. “San Salvador es la capital de El Salvador” es una proposición. “¿Qué hora es?” o “¡Cerrá la puerta!” <b>no</b> lo son: no se pueden calificar como V o F.</p>
<h3>Los tres operadores</h3>
<table><tr><th>Operador</th><th>Se lee</th><th>Es verdadero cuando…</th></tr>
<tr><td>A AND B</td><td>A y B</td><td>las dos son V</td></tr>
<tr><td>A OR B</td><td>A o B</td><td>al menos una es V (también si las dos lo son)</td></tr>
<tr><td>NOT A</td><td>no A</td><td>A es F (invierte el valor)</td></tr></table>
<h3>Tablas de verdad</h3>
<p>Muestran el resultado para todas las combinaciones posibles. Con <b>n</b> variables hay <b>2<sup>n</sup></b> filas: 2 variables → 4 filas; 3 variables → 8 filas.</p>
<table><tr><th>A</th><th>B</th><th>A AND B</th><th>A OR B</th></tr>
<tr><td>V</td><td>V</td><td>V</td><td>V</td></tr><tr><td>V</td><td>F</td><td>F</td><td>V</td></tr>
<tr><td>F</td><td>V</td><td>F</td><td>V</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td></tr></table>
<div class="note"><b>Orden:</b> primero lo que está entre paréntesis, luego NOT, luego AND, luego OR. Ante la duda, poné paréntesis.<br><b>Truco de examen:</b> traducí la frase. “Voy al partido si no llueve y terminé la tarea” = (NOT llueve) AND tarea.</div>
<p>¿Por qué importa en IA? Las computadoras toman decisiones combinando condiciones, y los sistemas de reglas son justamente esto.</p>`,
acts:[
 {type:"truth", title:"Laboratorio de tablas de verdad", intro:"Elegí una expresión y completá la columna de resultado tocando cada casilla (cambia entre V y F). Hacé al menos 3 expresiones."}
,
 {extra:true, type:"review", title:"Mini simulacro de la clase", topics:["t1","t2"], parts:[1,2,3], count:10, minutes:12}
],
quiz:[
 {q:"¿Cuál de estas es una proposición?", o:["¿Vas a ir a clase?","Cerrá la ventana","El volcán de San Salvador está en El Salvador","¡Qué calor!"], a:2, e:"Es la única que se puede calificar como verdadera o falsa."},
 {q:"Si A = V y B = F, ¿cuánto vale A AND B?", o:["V","F"], a:1, e:"AND necesita que ambas sean V."},
 {q:"Si A = V y B = F, ¿cuánto vale A OR B?", o:["V","F"], a:0, e:"OR es V si al menos una es V."},
 {q:"¿Cuántas filas tiene la tabla de verdad de una expresión con 3 variables?", o:["3","6","8","9"], a:2, e:"2³ = 8."},
 {q:"“Salgo si NO llueve AND tengo dinero”. Hoy llueve = F y tengo dinero = V. ¿Salgo?", o:["Sí","No"], a:0, e:"NOT F = V; V AND V = V."},
 {q:"Si A = V y B = V, ¿cuánto vale NOT (A AND B)?", o:["V","F"], a:1, e:"A AND B = V; NOT V = F."}
]},

/* ---------- PARTE (antes día 4) ---------- */
{n:4, topic:"t2", title:"Algoritmos y diagramas de flujo", mins:18,
lesson:`
<p>Un <span class="hl">algoritmo</span> es una secuencia <b>finita</b>, <b>ordenada</b> y <b>precisa</b> de pasos para resolver un problema. Una receta de pupusas es un algoritmo; “cociná algo rico” no lo es (no es preciso).</p>
<h3>Las tres estructuras básicas</h3>
<ul><li><b>Secuencia</b>: un paso después de otro.</li>
<li><b>Condición (decisión)</b>: SI pasa algo, hacé esto; SI NO, hacé aquello.</li>
<li><b>Repetición (ciclo)</b>: MIENTRAS se cumpla algo, repetí unos pasos.</li></ul>
<h3>Símbolos de un diagrama de flujo</h3>
<table><tr><th>Forma</th><th>Significa</th></tr>
<tr><td>Óvalo</td><td>Inicio o fin</td></tr><tr><td>Rectángulo</td><td>Proceso o acción (calcular, asignar)</td></tr>
<tr><td>Rombo</td><td>Decisión (pregunta con Sí/No)</td></tr><tr><td>Paralelogramo</td><td>Entrada o salida de datos (leer, mostrar)</td></tr>
<tr><td>Flecha</td><td>Indica el orden</td></tr></table>
<h3>Cómo “rastrear” un algoritmo</h3>
<p>Muchas preguntas de examen te dan un algoritmo y te preguntan qué muestra. Hacé una tablita con cada variable y anotá su valor paso a paso. Ejemplo:</p>
<p><code>x ← 1; MIENTRAS x &lt; 20: x ← x × 2; MOSTRAR x</code><br>x: 1 → 2 → 4 → 8 → 16 → 32 (32 ya no es menor que 20, para). Muestra <b>32</b>.</p>`,

/* ---------- PARTE (antes día 5) ---------- */
{n:5, topic:"t2", title:"Patrones, descomposición y abstracción", mins:17,
lesson:`
<p>El <span class="hl">pensamiento computacional</span> es una forma de resolver problemas como lo haría un programador. Tiene cuatro pilares:</p>
<table><tr><th>Pilar</th><th>Qué es</th><th>Ejemplo</th></tr>
<tr><td>Descomposición</td><td>Dividir un problema grande en partes pequeñas</td><td>Organizar una fiesta: comida, música, invitados, lugar</td></tr>
<tr><td>Reconocimiento de patrones</td><td>Encontrar lo que se repite o se parece</td><td>Notar que muchos correos basura dicen “ganaste”</td></tr>
<tr><td>Abstracción</td><td>Quedarte con lo importante e ignorar detalles</td><td>Un mapa de rutas de bus que solo muestra paradas</td></tr>
<tr><td>Algoritmos</td><td>Escribir los pasos para resolverlo</td><td>Instrucciones para armar un mueble</td></tr></table>
<p>El <b>reconocimiento de patrones</b> es el corazón del aprendizaje automático: un modelo aprende patrones en los datos para predecir casos nuevos.</p>
<h3>Cómo atacar sucesiones</h3>

<li>Mirá si cada término depende de los dos anteriores (1, 1, 2, 3, 5, 8: Fibonacci).</li>
<li>Con letras, pasalas a números: A=1, B=2, C=3…</li></ul>`,

/* ---------- PARTE (antes día 6) ---------- */
{n:6, topic:"t3", title:"Grafos: nodos, aristas y caminos", mins:23,
lesson:`
<p>Un <span class="hl">grafo</span> es una forma de representar <b>conexiones</b>. Tiene <b>nodos</b> (también llamados vértices: los puntos) y <b>aristas</b> (las líneas que los unen).</p>
<ul>
<li><b>No dirigido</b>: la conexión va en ambos sentidos. Ejemplo: amistad en Facebook (si yo soy tu amigo, vos sos mi amigo).</li>
<li><b>Dirigido</b>: las aristas tienen flecha. Ejemplo: seguir a alguien en Instagram, o una calle de una sola vía.</li>
<li><b>Vecinos</b> de un nodo: los nodos conectados directamente con él.</li>
<li><b>Grado</b> de un nodo: cuántas aristas tiene.</li>
<li><b>Camino</b>: secuencia de nodos donde cada uno está conectado con el siguiente. Su <b>longitud</b> es el número de aristas.</li>
<li><b>Camino más corto</b>: el de menos aristas (o menor distancia total si las aristas tienen pesos). Puede haber más de uno.</li></ul>
<div class="note">Contá bien: un camino A → B → C tiene 3 nodos pero <b>2 aristas</b>. Es un error común en exámenes.</div>
<p><b>¿Dónde aparecen?</b> Google Maps (ciudades y calles), redes sociales (personas y amistades), internet (computadoras y cables), recomendaciones (“a quienes les gustó esto, también…”).</p>
<p class="small muted">El mapa de la actividad es una red simplificada para practicar; no representa las calles reales.</p>`,

/* ---------- PARTE (antes día 8) ---------- */
{n:8, topic:"t4", title:"Datos: datasets, características y etiquetas", mins:20,
lesson:`
<p>Los <span class="hl">datos</span> son el combustible del aprendizaje automático. Un <b>dataset</b> (conjunto de datos) suele verse como una tabla:</p>
<ul><li>Cada <b>fila</b> es un <b>ejemplo</b> (una persona, una foto, un correo).</li>
<li>Cada <b>columna</b> es una <b>característica</b> (atributo, <i>feature</i>): información que describe al ejemplo.</li>
<li>La <b>etiqueta</b> (<i>label</i>) es la respuesta que queremos que el modelo aprenda a predecir.</li></ul>
<table><tr><th>Horas de estudio</th><th>Horas de sueño</th><th>Asistencia</th><th>¿Aprobó?</th></tr>
<tr><td>5</td><td>8</td><td>90 %</td><td>Sí</td></tr><tr><td>1</td><td>6</td><td>60 %</td><td>No</td></tr></table>
<p>Aquí hay 3 características y la etiqueta es “¿Aprobó?”.</p>
<h3>Tipos de datos</h3>
<p>Numéricos (edad, precio), categóricos (color, departamento), texto, imágenes, audio.</p>
<h3>Calidad de datos: basura entra, basura sale</h3>
<ul><li><b>Datos faltantes</b>: casillas vacías.</li><li><b>Errores</b>: valores imposibles (dormir 30 horas al día).</li>
<li><b>Duplicados</b>: la misma fila repetida.</li><li><b>Desbalance</b>: 990 ejemplos de “no” y 10 de “sí”.</li>
<li><b>No representativos</b>: si solo hay datos de un tipo de persona o lugar, el modelo falla con los demás.</li></ul>`,

/* ---------- PARTE (antes día 9) ---------- */
{n:9, topic:"t4", title:"Supervisado, no supervisado, entrenamiento y prueba", mins:20,
lesson:`
<h3>Aprendizaje supervisado</h3>
<p>Los datos <b>tienen etiqueta</b>: el modelo aprende de ejemplos con la respuesta correcta. Dos tareas:</p>
<ul><li><b>Clasificación</b>: predecir una <b>categoría</b>. ¿Spam o no spam? ¿Perro, gato o pájaro?</li>
<li><b>Regresión</b>: predecir un <b>número</b> continuo. ¿Cuánto costará esta casa? ¿Qué temperatura habrá mañana?</li></ul>
<h3>Aprendizaje no supervisado</h3>
<p>Los datos <b>no tienen etiqueta</b>. El modelo busca estructura por su cuenta. La tarea más común es el <b>agrupamiento</b> (<i>clustering</i>): juntar elementos parecidos, como clientes con hábitos similares.</p>
<div class="note"><b>Pregunta clave para el examen:</b> ¿la respuesta es una categoría (clasificación), un número (regresión) o no hay respuesta conocida y solo queremos grupos (agrupamiento)?</div>
<h3>Entrenamiento y prueba</h3>
<p>Dividimos los datos, por ejemplo 80 % para <b>entrenar</b> y 20 % para <b>probar</b>. La prueba se hace con datos que el modelo <b>nunca vio</b>, para saber si de verdad aprendió o solo memorizó. Probar con los mismos datos de entrenamiento es como estudiar con las respuestas del examen y luego decir que sos un genio.</p>
<p>Que un modelo funcione bien con datos nuevos se llama <b>generalizar</b>.</p>
<p class="small muted">Extra: existe también el aprendizaje por refuerzo (aprender con premios y castigos), pero no aparece en la lista oficial de la Fase 1.</p>`,

/* ---------- PARTE (antes día 10) ---------- */
{n:10, topic:"t4", title:"Agrupamiento con k-medias", mins:15,
lesson:`
<p>En el <span class="hl">agrupamiento</span> no hay etiquetas. El objetivo es formar grupos (clústeres) donde los elementos de un mismo grupo se parezcan entre sí y se diferencien de los otros grupos.</p>
<h3>La idea de k-medias (k-means)</h3>
<ol><li>Elegís cuántos grupos querés: <b>k</b>.</li>
<li>Se ponen k <b>centros</b> al azar.</li>
<li>Cada punto se <b>asigna</b> al centro más cercano.</li>
<li>Cada centro se <b>mueve</b> al promedio de sus puntos.</li>
<li>Se repiten los pasos 3 y 4 hasta que los centros dejan de moverse.</li></ol>
<p>No necesitás memorizar el algoritmo para la Fase 1, pero sí entender la idea: <b>agrupa por parecido, sin saber las respuestas</b>.</p>
<h3>Clasificación vs. agrupamiento</h3>
<table><tr><th></th><th>Clasificación</th><th>Agrupamiento</th></tr>
<tr><td>¿Hay etiquetas?</td><td>Sí</td><td>No</td></tr>
<tr><td>Grupos</td><td>Conocidos de antemano</td><td>Los descubre el algoritmo</td></tr>
<tr><td>Ejemplo</td><td>¿Esta foto es gato o perro?</td><td>Ordenar 10 000 fotos en grupos parecidos</td></tr></table>`,

/* ---------- PARTE (antes día 11) ---------- */
{n:11, topic:"t5", title:"Imágenes: aprender por ejemplos y sus errores", mins:18,
lesson:`
<p>Para una computadora, una imagen es una cuadrícula de <b>píxeles</b>, y cada píxel son números (lo verás a fondo en la Fase 2).</p>
<h3>Dos tareas comunes</h3>
<ul><li><b>Clasificación de imágenes</b>: decir qué hay en la imagen completa (“es un perro”).</li>
<li><b>Reconocimiento o detección</b>: encontrar objetos y dónde están (“hay 3 personas y 1 carro, aquí”). El reconocimiento facial identifica o verifica a una persona.</li></ul>
<h3>Aprendizaje mediante ejemplos</h3>
<p>Nadie le escribe al modelo “un gato tiene orejas puntiagudas”. Se le muestran miles de imágenes etiquetadas y el modelo descubre qué patrones ayudan a acertar.</p>
<h3>¿Por qué se equivocan?</h3>
<ul><li><b>Pocos ejemplos</b> o ejemplos muy parecidos entre sí.</li>
<li><b>Datos no representativos</b>: si solo vio perros grandes, puede fallar con chihuahuas.</li>
<li><b>Atajos</b>: el modelo aprende algo que no es lo que queríamos. En un experimento famoso, un clasificador “lobo vs. husky” se fijaba en la <b>nieve del fondo</b>, no en el animal.</li>
<li><b>Condiciones distintas</b>: poca luz, ángulo raro, imagen borrosa.</li></ul>
<div class="note"><b>Falso positivo</b>: dice que sí, pero era no (marca como “perro” una foto de un gato). <b>Falso negativo</b>: dice que no, pero era sí (no detecta al perro que sí estaba).</div>`,

/* ---------- PARTE (antes día 12) ---------- */
{n:12, topic:"t5", title:"IA generativa, modelos de lenguaje y prompts", mins:30,
lesson:`
<p>La <span class="hl">IA generativa</span> crea contenido nuevo: texto, imágenes, audio, video o código. La IA que vimos antes (clasificar, predecir) se llama a veces discriminativa o predictiva.</p>
<h3>Modelos de lenguaje (LLM)</h3>
<p>Un modelo de lenguaje grande se entrena con enormes cantidades de texto para hacer algo sorprendentemente simple: <b>predecir la siguiente palabra</b> (en realidad, el siguiente <i>token</i>, un pedazo de palabra). Repitiendo eso muchas veces, escribe respuestas completas.</p>
<p>Un <b>chatbot</b> es la aplicación de conversación construida sobre un modelo de lenguaje.</p>
<h3>Lo que NO hacen</h3>
<ul><li>No “saben” como una persona ni entienden el mundo como vos.</li>
<li>Pueden <b>alucinar</b>: inventar datos, fechas o fuentes con mucha seguridad.</li>
<li>Su conocimiento tiene una <b>fecha de corte</b>; no saben lo que pasó después, a menos que busquen en internet.</li></ul>
<h3>Prompts</h3>
<p>Un <b>prompt</b> es la instrucción que le das al modelo. Un buen prompt incluye:</p>
<ul><li><b>Contexto</b>: quién sos, para qué lo necesitás.</li><li><b>Tarea clara</b>: qué querés exactamente (verbo concreto).</li>
<li><b>Formato</b>: lista, tabla, 3 párrafos, 100 palabras.</li><li><b>Restricciones</b>: nivel, lo que no debe hacer.</li>
<li>Opcional: <b>ejemplos</b> o un <b>rol</b> (“actuá como un profesor de física”).</li></ul>
<p>Y si no sale bien a la primera: <b>iterá</b>, corregí el prompt.</p>`,

/* ---------- PARTE (antes día 13) ---------- */
{n:13, topic:"t6", title:"Ética, privacidad y verificación", mins:21,
lesson:`
<h3>Privacidad y datos personales</h3>
<p>Datos personales: nombre completo, DUI, dirección, teléfono, fotos, ubicación, datos de salud. No los compartás con chatbots ni apps sin necesidad: pueden guardarse y usarse para entrenar o terminar expuestos.</p>
<h3>Sesgos</h3>
<p>Un <b>sesgo</b> es un error sistemático que favorece o perjudica a ciertos grupos. Casi siempre viene de los <b>datos</b>: si un modelo de contratación aprende de una empresa que históricamente contrató casi solo hombres, puede “aprender” a descartar mujeres.</p>
<h3>Decisiones automatizadas</h3>
<p>Cuando una IA decide sobre préstamos, becas, empleo o justicia, debe haber <b>supervisión humana</b>, explicación de la decisión y forma de apelar.</p>
<h3>Alucinaciones y verificación</h3>
<p>Los chatbots pueden inventar. Para verificar: buscá la <b>fuente original</b>, contrastá con <b>varias fuentes confiables</b>, revisá la <b>fecha</b> y el <b>autor</b>, y desconfiá de lo que solo aparece en un lugar.</p>
<h3>Deepfakes y desinformación</h3>
<p>Un <b>deepfake</b> es video, imagen o audio falso generado con IA que imita a una persona real. Señales: labios que no coinciden con la voz, parpadeo raro, bordes borrosos, luz inconsistente. Pero cada vez son mejores, así que lo más fiable es <b>verificar la fuente</b>: ¿lo publicó un medio serio o la cuenta oficial? Las búsquedas inversas de imágenes también ayudan.</p>
<h3>Uso responsable</h3>
<p>Usá la IA para aprender, no para copiar sin entender; decí cuándo la usaste; respetá las reglas (en la OSIA, los recursos permitidos se anuncian antes de cada ronda).</p>`,

const KEY = "osia-ruta-f1-v1";
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.days) return s; }catch(e){} return {days:{}, examDate:"", sims:[], chat:[]}; }
let S = load();
if(!S.chat) S.chat = [];

function ds(n){ if(!S.days[n]) S.days[n] = {read:false, acts:{}, quiz:null}; return S.days[n]; }

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class") el.className = v;
    else if(k==="html") el.innerHTML = v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) el.setAttribute(k, v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function shuffle(a, rnd=Math.random){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function seeded(seed){ let s = seed>>>0; return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
function gauss(rnd){ let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const redrawers = new Set();
function redrawAll(){ redrawers.forEach(f=>{ try{ f(); }catch(e){} }); }

/* ================= progreso ================= */
function quizPass(d){ return Math.ceil(d.quiz.length*0.8); }
function isDone(d){
  const st = S.days[d.n]; if(!st) return false;
  if(d.review) return !!st.acts[0];
  const actsOk = d.acts.every((a,i)=>a.extra || st.acts[i]); // la práctica extra es opcional
  const quizOk = st.quiz!=null && st.quiz >= quizPass(d);
  return actsOk && quizOk && st.read;
}
function dayParts(d){
  const st = S.days[d.n] || {acts:{}};
  if(d.review) return {done: st.acts[0]?1:0, total:1};
  const core = d.acts.map((a,i)=>[a,i]).filter(([a])=>!a.extra);
  let done = (st.read?1:0) + core.filter(([a,i])=>st.acts[i]).length + ((st.quiz!=null && st.quiz>=quizPass(d))?1:0);
  return {done, total: 2 + core.length};
}
function overall(){ let a=0,b=0; DAYS.forEach(d=>{ const p=dayParts(d); a+=p.done; b+=p.total; }); return Math.round(a/b*100); }
function nextDay(){ return DAYS.find(d=>!isDone(d)) || null; }
function markAct(n,i){ ds(n).acts[i]=true; save(); refreshChecks(); }
function weakTopics(){
  const last = S.sims[S.sims.length-1]; if(!last) return [];
  return Object.entries(last.byTopic).filter(([t,v])=>v.n>0 && v.c/v.n < 0.7).map(([t])=>t);
}
function classOf(n){ return CLASSES.find(c=>c.parts.includes(n)); }
function partLabel(n){ const c=classOf(n); return c ? c.n+"."+(c.parts.indexOf(n)+1) : String(n); }
function partsOf(c){ return c.parts.map(n=>DAYS.find(d=>d.n===n)); }
function classDone(c){ return partsOf(c).every(isDone); }
function classProg(c){ let a=0,b=0; partsOf(c).forEach(d=>{ const p=dayParts(d); a+=p.done; b+=p.total; }); return {done:a,total:b}; }
function classMins(c){ return partsOf(c).reduce((t,d)=>t+d.mins,0); }
function nextClass(){ return CLASSES.find(c=>!classDone(c)) || null; }
function classesForTopic(t){ return CLASSES.filter(c=>c.topics.includes(t)).map(c=>c.n); }
function classLinks(t){ return classesForTopic(t).map((n,i)=>[i?" ":"", h("a",{class:"btn small ghost", style:"margin:2px 0", href:"#clase-"+n},"Clase "+n+" →")]); }

  const st = ds(d.n); el.innerHTML = "";
  if(d.review){ el.append(h("span",{class:st.acts[0]?"on":""}, st.acts[0]?"Simulacro hecho":"Simulacro pendiente")); return; }

  el.append(h("span",{class:(st.quiz!=null && st.quiz>=quizPass(d))?"on":""}, "Quiz: "+(st.quiz==null?"sin hacer":st.quiz+"/"+d.quiz.length)+" (meta "+quizPass(d)+")"));
}

        h("tbody",{}, SUBTOPICS[t].map(([name,pn])=>{

/* ================= tarjetas de conceptos clave ================= */
const CLASS1_LOGIC = ["Proposición","AND (y)","OR (o)","NOT (no)","Tabla de verdad"];
function conceptClass([t,d,tp]){
  if(tp==="t1") return 1;
  if(tp==="t2") return CLASS1_LOGIC.includes(t) ? 1 : 2; // la lógica del #02 va en la clase 1
  return {t3:2, t4:3, t5:4, t6:5}[tp];
}
function conceptsFor(cn){ return GLOSS.filter(g=>conceptClass(g)===cn); }

// Mazo de tarjetas: frente = concepto, reverso = definición
function deck(cards){
  if(!S.known) S.known = {};
  let order = cards.slice(), idx = 0, flipped = false, only = false;
  const box = h("div",{class:"deck"});
  const list = ()=> only ? order.filter(c=>!S.known[c[0]]) : order;
  function mark(v){
    const L = list(), c = L[idx];
    if(v) S.known[c[0]] = true; else delete S.known[c[0]];
    save(); flipped = false;
    if(!(only && v)) idx++;   // en "solo por repasar", la tarjeta sabida sale de la lista
    draw();
  }
  function draw(){
    box.innerHTML = "";
    const L = list(), knownN = cards.filter(c=>S.known[c[0]]).length;
    const onlyBtn = h("button",{class:"chip", "aria-pressed":String(only), onclick:()=>{ only=!only; idx=0; flipped=false; draw(); }}, "Solo las que tengo que repasar");
    const mixBtn = h("button",{class:"btn small ghost", onclick:()=>{ order=shuffle(order); idx=0; flipped=false; draw(); }}, "Mezclar");
    if(!L.length){ box.append(h("p",{class:"empty"}, "¡Ya sabés todas las tarjetas de este grupo!"), h("div",{class:"row", style:"justify-content:center"}, onlyBtn)); return; }
    if(idx>=L.length) idx = 0;
    const c = L[idx];
    const card = h("button",{class:"flash"+(flipped?" back":""), "aria-label": flipped? "Definición de "+c[0]+". Tocá para volver" : "Concepto: "+c[0]+". Tocá para ver la definición"},
      flipped ? [h("span",{class:"small muted"}, c[0]), h("span",{class:"fdef"}, c[1])]
              : [h("span",{class:"fterm"}, c[0]), h("span",{class:"small muted"}, "Tocá para ver la definición")]);
    card.onclick = ()=>{ flipped=!flipped; draw(); box.querySelector(".flash").focus(); };
    box.append(
      h("div",{class:"row", style:"justify-content:space-between; margin-bottom:8px"}, h("span",{class:"small"}, "Tarjeta "+(idx+1)+" de "+L.length), h("span",{class:"small muted"}, "Sabés "+knownN+" de "+cards.length)),
      card,
      h("div",{class:"row", style:"margin-top:12px; justify-content:center"},
        h("button",{class:"btn small ghost", onclick:()=>{ idx=(idx-1+L.length)%L.length; flipped=false; draw(); }}, "Anterior"),
        h("button",{class:"btn small ghost", onclick:()=>mark(false)}, "Repasar después"),
        h("button",{class:"btn small", onclick:()=>mark(true)}, "Lo sé ✓"),
        h("button",{class:"btn small ghost", onclick:()=>{ idx=(idx+1)%L.length; flipped=false; draw(); }}, "Siguiente")),
      h("div",{class:"row", style:"margin-top:10px; justify-content:center"}, onlyBtn, mixBtn));
  }
  draw();
  return box;
}

/* ================= quiz de cada parte ================= */
function prepQ(q){
  if(q.o.some(t=>/anteriores/i.test(t))) return {...q, opts:q.o.map((t,i)=>({t,i}))};
  return {...q, opts:shuffle(q.o.map((t,i)=>({t,i})))};
}
function renderQuiz(d){
  const box = h("div",{class:"card"});
  const draw = ()=>{
    box.innerHTML = "";
    const qs = shuffle(d.quiz).map(prepQ);
    let answered = 0, right = 0;
    const res = h("div");
    box.append(h("h2",{},"Quiz de la parte "+partLabel(d.n)), h("p",{class:"small muted"},"Meta: "+quizPass(d)+" de "+d.quiz.length+". Podés repetirlo; se guarda tu mejor resultado."));
    qs.forEach((q,qi)=>{
      const wrap = h("div",{class:"q"}, h("div",{class:"qt"}, (qi+1)+". "+q.q));
      const btns = q.opts.map(op=>{
        const b = h("button",{class:"opt"}, op.t);
        b.onclick = ()=>{
          btns.forEach((x,k)=>{ x.disabled = true; if(q.opts[k].i===q.a) x.classList.add("right"); });
          if(op.i===q.a) right++; else b.classList.add("wrong");
          wrap.append(h("div",{class:"exp"}, (op.i===q.a?"Correcto. ":"Incorrecto. ")+q.e));
          answered++;
          if(answered===qs.length){
            const best = Math.max(ds(d.n).quiz ?? 0, right); ds(d.n).quiz = best; save(); refreshChecks();
            const ok = right>=quizPass(d);
            res.append(h("div",{class:"result "+(ok?"ok":"no")}, "Resultado: "+right+" de "+qs.length+". "+(ok?"¡Meta cumplida!":"Repasá la lección y volvé a intentarlo.")),
              h("button",{class:"btn small ghost", style:"margin-top:10px", onclick:draw},"Repetir quiz"));
          }
        };
        return b;
      });
      wrap.append(...btns); box.append(wrap);
    });
    box.append(res);
  };
  draw();
  return box;
}

function actCard(a){ return h("div",{class:"card act"}, h("h3",{}, a.title), a.intro? h("p",{class:"muted"}, a.intro) : null); }

function actSorter(a, done){
  const c = actCard(a); const sel = {}; const rows = [];
  const items = shuffle(a.items.map((it,k)=>({...it,k})));
  items.forEach(it=>{
    const fb = h("div",{class:"fb"});
    const chips = a.cats.map((cat,ci)=>{
      const b = h("button",{class:"chip", "aria-pressed":"false"}, cat);
      b.onclick = ()=>{ sel[it.k]=ci; chips.forEach((x,xi)=>{ x.setAttribute("aria-pressed", xi===ci); x.classList.remove("right","wrong"); }); fb.textContent=""; };
      return b;
    });
    rows.push({it, chips, fb});
    c.append(h("div",{class:"sitem"}, h("div",{}, it.t), h("div",{class:"choices"}, chips), fb));
  });
  const res = h("div");
  c.append(h("div",{class:"row", style:"margin-top:12px"}, h("button",{class:"btn", onclick:()=>{
    let ok=0;
    rows.forEach(({it,chips,fb})=>{
      const s = sel[it.k];
      chips.forEach((x,xi)=>{ x.classList.remove("right","wrong"); if(xi===it.c) x.classList.add("right"); if(xi===s && s!==it.c) x.classList.add("wrong"); });
      if(s===it.c){ ok++; fb.className="fb ok"; fb.textContent = it.why ? "Bien. "+it.why : "Bien."; }
      else if(s==null){ fb.className="fb no"; fb.textContent="Sin responder."; }
      else { fb.className="fb no"; fb.textContent = "Era: "+a.cats[it.c]+"."+(it.why?" "+it.why:""); }
    });

    res.innerHTML=""; res.append(h("div",{class:"result "+(pass?"ok":"no")}, ok+" de "+rows.length+" correctas. "+(pass?"¡Actividad completada!":"Necesitás al menos 70 %. Corregí y comprobá otra vez.")));
    if(pass) done();
  }},"Comprobar")), res);
  return c;
}

function actOrder(a, done){
  const c = actCard(a);
  let cur = shuffle(a.steps); while(cur.join()===a.steps.join()) cur = shuffle(a.steps);
  const ol = h("ol",{class:"olist"}); const res = h("div");

    });

function actTruth(a, done){
  const c = actCard(a);
  const EX = [
    {l:"A AND B", v:["A","B"], f:(A,B)=>A&&B},
    {l:"A OR B", v:["A","B"], f:(A,B)=>A||B},
    {l:"A AND NOT B", v:["A","B"], f:(A,B)=>A&&!B},
    {l:"NOT (A OR B)", v:["A","B"], f:(A,B)=>!(A||B)},
    {l:"NOT A OR B", v:["A","B"], f:(A,B)=>(!A)||B},
    {l:"(A OR B) AND NOT C", v:["A","B","C"], f:(A,B,C)=>(A||B)&&!C},
    {l:"A AND (B OR C)", v:["A","B","C"], f:(A,B,C)=>A&&(B||C)}
  ];
  const solved = new Set();
  const selBox = h("div",{class:"choices", style:"margin-bottom:10px"});
  const area = h("div"); const res = h("div");
  const prog = h("p",{class:"small muted"});
  const show = (ex)=>{
    [...selBox.children].forEach(b=>b.setAttribute("aria-pressed", b.textContent===ex.l));
    area.innerHTML=""; res.innerHTML="";
    const n = ex.v.length, rows = [];
    for(let r=0;r<(1<<n);r++){ rows.push(ex.v.map((_,k)=>!((r>>(n-1-k))&1))); }
    const vals = rows.map(()=>null);
    const tb = h("tbody");
    const cells = rows.map((row,ri)=>{
      const btn = h("button",{"aria-label":"Resultado fila "+(ri+1)},"?");
      btn.onclick = ()=>{ vals[ri] = vals[ri]===null? true : (vals[ri]? false : null); btn.textContent = vals[ri]===null?"?":(vals[ri]?"V":"F"); td.className=""; };
      const td = h("td",{}, btn);
      tb.append(h("tr",{}, row.map(x=>h("td",{}, x?"V":"F")), td));
      return td;
    });
    area.append(h("div",{class:"scroll"}, h("table",{class:"tt"}, h("thead",{}, h("tr",{}, ex.v.map(x=>h("th",{},x)), h("th",{}, ex.l))), tb)),
      h("button",{class:"btn", style:"margin-top:10px", onclick:()=>{
        let ok=0; rows.forEach((row,ri)=>{ const want = !!ex.f(...row); const good = vals[ri]===want; if(good) ok++; cells[ri].className = vals[ri]===null? "wrong" : (good?"right":"wrong"); });
        res.innerHTML="";
        if(ok===rows.length){ solved.add(ex.l); res.append(h("div",{class:"result ok"},"¡Tabla correcta!")); }
        else res.append(h("div",{class:"result no"}, ok+" de "+rows.length+" filas bien. Revisá las rojas."));
        prog.textContent = "Expresiones resueltas: "+solved.size+" (meta: 3)";
        if(solved.size>=3) done();
      }},"Comprobar tabla"));
  };
  EX.forEach(ex=> selBox.append(h("button",{class:"chip", "aria-pressed":"false", onclick:()=>show(ex)}, ex.l)));
  prog.textContent = "Expresiones resueltas: 0 (meta: 3)";
  c.append(selBox, prog, area, res); show(EX[0]);
  return c;
}

    {t:"Biblioteca Nacional: descargá gratis el libro del mes [enlace]", spam:false, f:{gratis:1,desc:1,link:1}}
  ];
  const on = {}; let best=0; let touched=false; // touched: si ya tocó alguna regla
  const list = h("div"); const score = h("div",{class:"result no"}); const qBox = h("div");
  const toggles = R.map(([k,t])=>{ const b=h("button",{class:"chip","aria-pressed":"false"}, t); b.onclick=()=>{ touched=true; on[k]=!on[k]; b.setAttribute("aria-pressed", !!on[k]); draw(); }; return b; });
  function draw(){
    list.innerHTML=""; let ok=0;
    // Antes de tocar una regla: mostrar los correos sin resultados
    if(!touched){
      E.forEach(e=>list.append(h("div",{class:"email"}, h("div",{}, e.t, h("div",{class:"small muted"}, "En realidad: "+(e.spam?"spam":"correo normal"))), h("span",{class:"badge"}, "Sin revisar"))));
      score.className = "result"; score.style.background = "var(--pen-soft)"; score.style.color = "var(--pen)";
      score.textContent = "Todavía no activaste ninguna regla. Tocá una o varias reglas de arriba para ver cómo clasifica los correos.";
      return;
    }
    score.style.background = ""; score.style.color = "";
    E.forEach(e=>{ const pred = R.some(([k])=>on[k] && e.f[k]); const good = pred===e.spam; if(good) ok++;
      list.append(h("div",{class:"email"}, h("div",{}, e.t, h("div",{class:"small muted"}, "En realidad: "+(e.spam?"spam":"correo normal"))), h("span",{class:"badge "+(good?"ok":"no")}, (pred?"Marcado spam":"Bandeja")+(good?" ✓":" ✗")))); });
    best=Math.max(best,ok);
    score.className = "result "+(ok>=7?"ok":"no");
    score.textContent = "Aciertos: "+ok+" de 8. Mejor intento: "+best+" de 8.";
  }
  const q = {q:"¿Por qué con estas reglas no llegás a 8 de 8?", o:["Porque faltan más reglas de mayúsculas","Porque correos normales y spam comparten las mismas señales: cualquier regla que atrapa uno también atrapa el otro","Porque los correos están mal escritos","Sí se puede llegar a 8 de 8"], a:1, e:"Las reglas fijas no captan el contexto. Por eso los filtros modernos aprenden de miles de ejemplos y combinan muchas señales con distinto peso."};
  const btns = q.o.map((t,i)=>{ const b=h("button",{class:"opt"},t); b.onclick=()=>{ btns.forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("right"); }); if(i!==q.a) b.classList.add("wrong"); qBox.append(h("div",{class:"exp"}, q.e)); if(i===q.a) done(); else qBox.append(h("button",{class:"btn small ghost", style:"margin-top:8px", onclick:()=>{ btns.forEach(x=>{ x.disabled=false; x.classList.remove("right","wrong"); }); qBox.querySelectorAll(".exp, .btn").forEach(n=>n.remove()); }},"Intentar otra vez")); }; return b; });
  qBox.append(h("div",{class:"qt", style:"font-weight:700; margin-top:14px"}, q.q), ...btns);
  c.append(h("div",{class:"choices", style:"margin-bottom:10px"}, toggles), score, list, h("p",{class:"small muted"},"Probá varias combinaciones antes de responder."), qBox);
  draw();
  return c;
}

/* ---------- siguiente palabra ---------- */
function actNext(a, done){
  const c = actCard(a);
  const W = [["pupusas",.52],["tortas",.18],["papas",.14],["sopas",.09],["galletas",.06],["nubes",.01]];
  let revealed=false, sampled=false;
  const probs = h("div",{class:"probs", style:"display:none"}); const outS = h("p",{}); const pick = h("div");
  const pickBtns = W.map(([w])=>{ const b=h("button",{class:"chip"}, w); b.onclick=()=>{ revealed=true; pickBtns.forEach(x=>{ x.disabled=true; if(x.textContent===W[0][0]) x.classList.add("right"); }); if(w!==W[0][0]) b.classList.add("wrong"); probs.style.display="block"; pick.append(h("p",{class:"small"}, w===W[0][0]? "¡Exacto! Es la más probable según lo que el modelo vio en sus datos." : "La más probable es “pupusas”: en textos salvadoreños esa combinación aparece muchísimo.")); chk(); }; return b; });
  W.forEach(([w,p])=>probs.append(h("div",{class:"p"}, h("span",{}, w), h("span",{}, h("b",{style:"width:"+(p*100/.52*0.95)+"%"})), h("span",{class:"small"}, Math.round(p*100)+" %"))));
  function chk(){ if(revealed && sampled) done(); }
  c.append(
    h("p",{class:"muted"},"Un modelo de lenguaje ve: “Después de la escuela fui con mis amigos a comer unas…”. ¿Qué palabra crees que considera más probable?"),
    h("div",{class:"choices", style:"margin-bottom:10px"}, pickBtns), pick, probs,
    h("p",{class:"small muted"},"Probabilidades inventadas con fines didácticos."),
    h("button",{class:"btn small", onclick:()=>{ const out=[]; for(let i=0;i<10;i++){ let r=Math.random(), acc=0; for(const [w,p] of W){ acc+=p; if(r<=acc){ out.push(w); break; } } if(out.length<i+1) out.push(W[0][0]); } outS.textContent = "10 generaciones: "+out.join(", ")+". "; outS.append(h("span",{class:"muted"},"Casi siempre gana la más probable, pero no siempre: por eso un chatbot puede responder distinto a la misma pregunta.")); sampled=true; chk(); }},"Generar 10 veces"), outS);
  return c;
}

/* ---------- laboratorio de prompts ---------- */
function actPrompt(a, done){
  const c = actCard(a);
  const ta = h("textarea",{"aria-label":"Tu prompt mejorado", placeholder:"Escribí aquí tu versión mejorada del prompt…"});
  const chk = h("ul",{class:"checklist"});   const tests = [
    ["Contexto (quién sos o para qué es)", /\b(soy|estudio|estudiante|grado|bachillerato|tengo \d+|años|para (mi|una|un|el|la)|estoy)\b/i],
    ["Tarea clara (un verbo concreto)", /\b(explic\w*|resum\w*|compar\w*|enumer\w*|describ\w*|d[aá]me|haceme|hazme|cre[aá]\w*|escrib\w*|ayud[aá]me|gener\w*|list\w*|correg\w*|revis\w*)\b/i],
    ["Formato (lista, pasos, tabla, extensión)", /\b(lista|tabla|p[aá]rrafos?|pasos|puntos|viñetas|palabras|l[ií]neas|oraciones|esquema|resumen de \d+)\b/i],
    ["Restricciones o nivel", /\b(m[aá]ximo|m[ií]nimo|sin |no (uses|incluyas|des|me des)|s[oó]lo|nivel|sencill\w*|f[aá]cil|corto|breve|simple)\b/i]
  ];
  const res = h("div");
  c.append(
    h("p",{}, "Prompt débil: ", h("b",{},"“hacé mi tarea de historia”")),
    h("p",{class:"muted"},"Reescribilo para que un chatbot te ayude a APRENDER el tema (no a copiar). Ejemplo de tema: la independencia de Centroamérica."),
    ta,
    h("div",{class:"row", style:"margin-top:10px"}, h("button",{class:"btn", onclick:()=>{
      const p = ta.value; chk.innerHTML=""; let n=0;
      tests.forEach(([l,re])=>{ const ok = re.test(p); if(ok) n++; chk.append(h("li",{}, (ok?"✅ ":"⬜ ")+l)); });
      if(p.trim().length<40) chk.append(h("li",{},"⚠️ Es muy corto: un buen prompt suele tener al menos una o dos oraciones."));
      if(/(hac[eé]|haz)(me)? (mi|la) tarea/i.test(p)) chk.append(h("li",{},"⚠️ Sigue pidiendo que haga tu tarea. Pedí que te explique o te haga preguntas."));
      res.innerHTML=""; const ok = n>=3 && p.trim().length>=40;
      res.append(h("div",{class:"result "+(ok?"ok":"no")}, ok? "¡Buen prompt! Cumple "+n+" de 4 criterios." : "Cumple "+n+" de 4 criterios. Meta: al menos 3."));
      if(ok) done();
    }},"Revisar mi prompt")),
    chk, res,
    h("p",{class:"small muted"},"La revisión automática solo busca palabras clave; es una guía, no una nota perfecta."));
  return c;
}

/* ---------- repaso / simulacro desde un día ---------- */
function actReview(a, done, d, i){
  const c = h("div",{class:"card ink"});
  const last = [...S.sims].reverse().find(s=>s.fromDay===d.n && (s.actIdx||0)===i);
  // con "parts", el mini simulacro solo usa preguntas de las partes de esa clase
  const scope = a.parts ? "preguntas mezcladas de las partes "+a.parts.map(partLabel).join(", ") : "temas: "+a.topics.map(t=>TOPICS[t]).join("; ");
  c.append(...[h("h2",{}, a.count===30?"Simulacro final":"Mini simulacro de la clase"),
    h("p",{}, a.count+" preguntas, "+a.minutes+" minutos, "+scope+"."),
    last? h("p",{class:"small"}, "Tu último intento: "+last.score+" de "+last.total+" ("+Math.round(last.score/last.total*100)+" %).") : null,
    h("button",{class:"btn", onclick:()=>{ pendingSim = {topics:a.topics, parts:a.parts||null, count:a.count, minutes:a.minutes, fromDay:d.n, actIdx:i}; SIM=null; location.hash="simulacro"; }}, last?"Repetir":"Empezar")].filter(Boolean));
  return c;
}

/* ================= vista: simulacro ================= */
function buildPool(topics){
  const pool=[];
  DAYS.forEach(d=>{ if(d.topic && topics.includes(d.topic)) d.quiz.forEach(q=>pool.push({...q, topic:d.topic})); });
  EXTRA.forEach(q=>{ if(topics.includes(q.topic)) pool.push(q); });
  return pool;
}
function pickBalanced(topics, count){
  const by = {}; topics.forEach(t=>by[t]=shuffle(buildPool([t])));
  const out=[]; let t=0, order=shuffle(topics), guard=0;
  while(out.length<count && guard<1000){ const tp=order[t%order.length]; if(by[tp].length) out.push(by[tp].pop()); t++; guard++; if(order.every(x=>!by[x].length)) break; }
  return shuffle(out).map(prepQ);
}
let simTimer=null;
function renderSim(){
  if(pendingSim){ startSim(pendingSim); pendingSim=null; }
  if(SIM && !SIM.finished){ drawSimRun(); return; }
  if(SIM && SIM.finished){ drawSimResult(); return; }
  const topics = new Set(Object.keys(TOPICS)); let count=20;
  const tBox = h("div",{class:"choices"}, Object.entries(TOPICS).map(([k,v])=>{ const b=h("button",{class:"chip","aria-pressed":"true"}, v); b.onclick=()=>{ topics.has(k)?topics.delete(k):topics.add(k); b.setAttribute("aria-pressed", topics.has(k)); }; return b; }));
  const cBox = h("div",{class:"choices"}, [10,20,30].map(n=>{ const b=h("button",{class:"chip","aria-pressed":String(n===count)}, n+" preguntas"); b.onclick=()=>{ count=n; [...cBox.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); }; return b; }));
  const hist = S.sims.slice(-5).reverse();
  put(h("h1",{style:"font-size:clamp(1.7rem,4vw,2.4rem)"},"Simulacro"),
    h("p",{class:"muted"},"Preguntas al azar del banco de práctica, sin ver las respuestas hasta el final, con tiempo. Unos 80 segundos por pregunta."),
    h("div",{class:"card"}, h("strong",{},"Temas"), tBox, h("strong",{style:"display:block;margin-top:12px"},"Cantidad"), cBox,
      h("button",{class:"btn", style:"margin-top:14px", onclick:()=>{ if(!topics.size) return; startSim({topics:[...topics], count, minutes:Math.round(count*80/60)}); render(); }},"Empezar simulacro")),
    hist.length? h("div",{class:"card"}, h("strong",{},"Tus últimos simulacros"), h("ul",{style:"margin:6px 0 0;padding-left:1.2em"}, hist.map(s=>h("li",{}, new Date(s.date).toLocaleDateString("es-SV",{day:"numeric",month:"short"})+": "+s.score+" de "+s.total+" ("+Math.round(s.score/s.total*100)+" %)")))) : null,
    h("p",{class:"small muted"},"Estas preguntas son de práctica, basadas en el temario público. El examen real puede tener otro formato y dificultad."));
}
function startSim(cfg){
  let qs;
  if(cfg.parts){ // mini simulacro de una clase: solo preguntas de sus partes
    const pool = []; cfg.parts.forEach(n=>{ const d=DAYS.find(x=>x.n===n); d.quiz.forEach(q=>pool.push({...q, topic:d.topic})); });
    qs = shuffle(pool).slice(0, cfg.count).map(prepQ);
  } else qs = pickBalanced(cfg.topics, cfg.count);
  SIM = {cfg, qs, ans: qs.map(()=>null), idx:0, endAt: Date.now()+cfg.minutes*60000, finished:false};
}
function drawSimRun(){
  const q = SIM.qs[SIM.idx];
  const timer = h("span",{class:"timer"});
  const tick = ()=>{ const ms = SIM.endAt-Date.now(); if(ms<=0){ finishSim(); return; } const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; timer.textContent = m+":"+String(s).padStart(2,"0"); };
  clearInterval(simTimer); simTimer = setInterval(()=>{ if(!location.hash.startsWith("#simulacro")){ return; } tick(); }, 1000); tick();
  const grid = h("div",{class:"qgrid"}, SIM.qs.map((_,i)=>h("button",{class:(SIM.ans[i]!=null?"ans ":"")+(i===SIM.idx?"cur":""), "aria-label":"Ir a la pregunta "+(i+1), onclick:()=>{ SIM.idx=i; render(); }}, i+1)));
  const opts = q.opts.map((op,k)=>{ const b=h("button",{class:"opt", "aria-pressed":String(SIM.ans[SIM.idx]===k), style: SIM.ans[SIM.idx]===k? "border-color:var(--pen);background:var(--pen-soft);font-weight:700":""}, String.fromCharCode(65+k)+") "+op.t); b.onclick=()=>{ SIM.ans[SIM.idx]=k; render(); }; return b; });
  const answered = SIM.ans.filter(x=>x!=null).length;
  put(
    h("div",{class:"row", style:"justify-content:space-between"}, h("h1",{style:"font-size:1.6rem;margin:0"},"Pregunta "+(SIM.idx+1)+" de "+SIM.qs.length), timer),
    grid,
    h("div",{class:"card ink"}, h("div",{class:"small muted"}, TOPICS[q.topic]), h("div",{class:"qt", style:"font-weight:700;font-size:1.1rem;margin:6px 0 10px"}, q.q), opts),
    h("div",{class:"daynav"},
      h("button",{class:"btn ghost", disabled: SIM.idx===0, onclick:()=>{ SIM.idx--; render(); }},"Anterior"),
      SIM.idx<SIM.qs.length-1? h("button",{class:"btn", onclick:()=>{ SIM.idx++; render(); }},"Siguiente") : h("span")),
    h("div",{class:"card", style:"margin-top:16px"}, h("p",{style:"margin:0 0 8px"}, "Respondidas: "+answered+" de "+SIM.qs.length),
      h("button",{class:"btn", onclick:()=>{ if(answered<SIM.qs.length && !confirm("Te faltan "+(SIM.qs.length-answered)+" preguntas. ¿Terminar de todos modos?")) return; finishSim(); }},"Terminar y ver resultados"),
      " ", h("button",{class:"btn ghost small", onclick:()=>{ if(confirm("¿Abandonar el simulacro? No se guardará.")){ clearInterval(simTimer); SIM=null; render(); } }},"Abandonar")));
}
function finishSim(){
  clearInterval(simTimer);
  if(!SIM || SIM.finished) return;
  SIM.finished = true;
  const byTopic = {}; let score=0;
  SIM.qs.forEach((q,i)=>{ const t=q.topic; byTopic[t]=byTopic[t]||{c:0,n:0}; byTopic[t].n++; const ok = SIM.ans[i]!=null && q.opts[SIM.ans[i]].i===q.a; if(ok){ byTopic[t].c++; score++; } });
  SIM.result = {date:Date.now(), score, total:SIM.qs.length, byTopic, fromDay:SIM.cfg.fromDay||null, actIdx:SIM.cfg.actIdx||0};
  S.sims.push(SIM.result); if(S.sims.length>30) S.sims=S.sims.slice(-30);
  if(SIM.cfg.fromDay) ds(SIM.cfg.fromDay).acts[SIM.cfg.actIdx||0]=true;
  save();
  if(location.hash.startsWith("#simulacro")) render();
}
function drawSimResult(){
  const r = SIM.result, pct = Math.round(r.score/r.total*100);
  const wrong = SIM.qs.map((q,i)=>({q,i})).filter(({q,i})=> !(SIM.ans[i]!=null && q.opts[SIM.ans[i]].i===q.a));
  const weak = Object.entries(r.byTopic).filter(([t,v])=>v.c/v.n<0.7);
  put(h("h1",{style:"font-size:clamp(1.7rem,4vw,2.4rem)"},"Resultado: "+r.score+" de "+r.total+" ("+pct+" %)"),
    h("div",{class:"card ink"}, h("strong",{},"Por tema"),
      Object.entries(r.byTopic).map(([t,v])=>{ const p=Math.round(v.c/v.n*100); return h("div",{class:"tbar"}, h("span",{class:"small"}, TOPICS[t]), h("div",{class:"bar"}, h("i",{style:"width:"+p+"%"})), h("span",{class:"small"}, v.c+"/"+v.n)); }),
      weak.length? h("p",{style:"margin-top:10px"}, "Repasá: ", weak.map(([t],k)=>[k?"; ":"", TOPICS[t]+" (", classLinks(t), ")"])) : h("p",{style:"margin-top:10px"},"¡Todos los temas en 70 % o más!")),
    wrong.length? h("div",{class:"card"}, h("h2",{},"Revisá tus errores"), wrong.map(({q,i})=>h("div",{class:"q"}, h("div",{class:"qt"}, q.q),
      h("div",{class:"small"}, "Tu respuesta: "+(SIM.ans[i]==null?"sin responder":q.opts[SIM.ans[i]].t)), h("div",{class:"small", style:"color:var(--ok);font-weight:700"}, "Correcta: "+q.o[q.a]), h("div",{class:"exp"}, q.e)))) : null,
    h("div",{class:"row"}, h("button",{class:"btn", onclick:()=>{ SIM=null; render(); }},"Nuevo simulacro"), (SIM.cfg.fromDay && classOf(SIM.cfg.fromDay)) ? h("a",{class:"btn ghost", href:"#clase-"+classOf(SIM.cfg.fromDay).n},"Volver a la clase "+classOf(SIM.cfg.fromDay).n) : h("a",{class:"btn ghost", href:"#ruta"},"Volver a la ruta"),
      h("a",{class:"btn ghost", href:"#conceptos"},"Repasar conceptos clave")));
}

/* ================= vista: glosario ================= */
function renderGloss(){
  let tf = null;
  const inp = h("input",{type:"text", placeholder:"Buscar: sesgo, arista, etiqueta…", "aria-label":"Buscar en el glosario"});
  const list = h("dl",{class:"gloss"});
  const fBox = h("div",{class:"choices", style:"margin:10px 0"}, h("button",{class:"chip","aria-pressed":"true", onclick:(e)=>setF(null,e.target)},"Todos"), Object.entries(TOPICS).map(([k,v])=>h("button",{class:"chip","aria-pressed":"false", onclick:(e)=>setF(k,e.target)}, v)));
  function setF(k,b){ tf=k; [...fBox.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); draw(); }
  const norm = s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  function draw(){
    const q = norm(inp.value.trim()); list.innerHTML="";
    const hits = GLOSS.filter(([t,d,tp])=>(!tf||tp===tf) && (!q || norm(t).includes(q) || norm(d).includes(q)));
    hits.forEach(([t,d,tp])=>list.append(h("dt",{}, t), h("dd",{}, d, " ", h("span",{class:"tag"}, TOPICS[tp].split(" ")[0]))));
    if(!hits.length) list.append(h("p",{class:"empty"}, "No está en el glosario. ", "Probá con otra palabra o revisá las tarjetas de conceptos clave."));
  }
  inp.addEventListener("input", draw);
  put(h("h1",{style:"font-size:clamp(1.7rem,4vw,2.4rem)"},"Glosario"), h("p",{class:"muted"},"Los términos clave del temario de la Fase 1."), inp, fBox, h("div",{class:"card"}, list));
  draw();
}

/* ================= tema ================= */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
try{ applyTheme(localStorage.getItem(KEY+"-theme")); }catch(e){}
themeBtn.onclick = ()=>{
  const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const t = dark? "light":"dark"; applyTheme(t); try{ localStorage.setItem(KEY+"-theme", t); }catch(e){}
  redrawAll();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawAll);

render();
